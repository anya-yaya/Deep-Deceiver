services:
  influxdb:
    image: influxdb:2.7
    container_name: deep-deceiver-influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: deepdeceiver123
      DOCKER_INFLUXDB_INIT_ORG: deep-deceiver
      DOCKER_INFLUXDB_INIT_BUCKET: forensics
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: deep-deceiver-local-token

volumes:
  influxdb_data:
  influxdb_config: